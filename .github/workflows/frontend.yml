name: Frontend CI/CD

# 필요한 Secrets (CD용):
#   CLOUDFLARE_API_TOKEN: Cloudflare API 토큰
#   CLOUDFLARE_ACCOUNT_ID: Cloudflare 계정 ID
#
# 설정 방법:
#   1. Cloudflare Dashboard → API Tokens → Create Token
#   2. "Edit Cloudflare Workers" 템플릿 사용 또는 Custom Token 생성
#   3. GitHub Repository → Settings → Secrets and variables → Actions
#   4. 'New repository secret'에서 위 Secrets 추가

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # CI: Lint, Type-check, Build
  # ===========================================
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # tokens dist는 앞 단계(type-check의 ^build)에서 생성된다. dist가 없으면 종료 코드 2(측정 실패)
      - name: Token reference check
        run: pnpm check-token-refs

      # agentic-ui 바탕 · 글자 짝이 tokens 대비 검산 표(ontology-pairs.mjs)에 있는지 (WI-0025 plan 5.3)
      - name: Contrast pair table check
        run: pnpm check-contrast-pairs

      - name: Test
        run: pnpm test

      - name: Build Registry
        run: pnpm build:registry

      - name: License check
        run: pnpm check-licenses

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '' }}

      # ===========================================
      # WI-0025 AC4 · AC6 · AC8 (Q7): Build 산출물(packages/*/dist, apps/web/out)을 쓰므로 Build 다음에 둔다
      # ===========================================

      # 퍼블리시 대상 패키지 수가 0이면 pack-smoke 가 "OK 0개" 로 끝나므로 1개 이상인지 따로 본다
      # pack-smoke 는 @axis-ds/mcp tarball 의 stdio 실행 스모크(scripts/mcp-smoke.mjs)도 돌린다. mcp 미발견은 「실행 스모크 미수행」으로 실패하고,
      # EXPECTED_TOOLS 1:1 이 깨지면 머지 전에 여기서 실패한다(WI-0036). mcp 설치에 npm 레지스트리 접근이 필요하다.
      # WI-0036(#116)이 job 끝에 따로 둔 같은 명령의 step 은 2026-10-19 사용자 결정(D-C)으로 이 step 하나로 합쳤다.
      - name: Pack smoke (외부 npm 소비 검증, AC4)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/pack-smoke.log"
          pnpm pack-smoke 2>&1 | tee "$log"
          n=$(grep -oE '퍼블리시 대상 [0-9]+개' "$log" | grep -oE '[0-9]+' || true)
          if ! [[ "$n" =~ ^[0-9]+$ ]] || [ "$n" -lt 1 ]; then
            echo "::error::pack-smoke 검사 패키지 수를 읽지 못했거나 0개예요 (값: '${n}')"
            exit 1
          fi

      # 캐시 키에 넣을 Playwright 버전은 lockfile 이 아니라 설치된 CLI 에서 읽는다
      - name: Read Playwright version
        id: pw
        run: |
          v=$(pnpm --filter @ax/web exec playwright --version | awk '{print $2}')
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Playwright 버전을 읽지 못했어요 (값: '${v}')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # 캐시가 맞아도 --with-deps 의 OS 의존성 설치는 매번 필요하다
      - name: Install Playwright chromium
        run: pnpm --filter @ax/web exec playwright install --with-deps chromium

      # 아래 E2E step 은 게이트 켬(a11y · nontext · tokens 는 2026-10-18 run 39072471115 확인, 브랜드 전환 데모는 첫 배선부터 게이트).
      # 실패하면 ci job 이 실패해 deploy-* (needs: ci) 를 막는다.
      # 확인 기록은 docs/workitems/WI-0025-brand-theme/todo.md 「Q7 CI 게이트 켜기」에 있다.
      # nontext · demo · tokens 는 앞 E2E step 이 실패해도 돌도록 if 를 둔다(모든 결과를 한 run 에서 보고, 건수 가드가 JSON 없음으로 오판하지 않게).
      # --output 을 나누는 이유: Playwright 는 실행마다 출력 디렉터리를 비우므로 같은 test-results 를 쓰면 앞 실행의 실패 산출물이 지워진다.
      - name: E2E a11y (브랜드 2 x 테마 2 x 10페이지, AC8)
        id: e2e-a11y
        env:
          E2E_SERVER: static
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/apps/web/playwright-report/a11y.json
        run: pnpm --filter @ax/web test:e2e:a11y --reporter=list,json --output=test-results/a11y

      - name: E2E 비텍스트 대비 (포커스 링 · 상태 표식 실요소, 주 표식 3:1)
        id: e2e-nontext
        if: ${{ !cancelled() && steps.e2e-a11y.outcome != 'skipped' }}
        env:
          E2E_SERVER: static
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/apps/web/playwright-report/nontext.json
        run: pnpm --filter @ax/web test:e2e:nontext --reporter=list,json --output=test-results/nontext

      # 전환 컨트롤 클릭으로 data-brand · 계산 스타일이 바뀌는지, 로드 전에 붙은 data-brand 를 지우지 않는지 본다(WI-0025 FR-10).
      - name: E2E 브랜드 전환 데모 (AC7)
        id: e2e-demo
        if: ${{ !cancelled() && steps.e2e-a11y.outcome != 'skipped' }}
        env:
          E2E_SERVER: static
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/apps/web/playwright-report/demo.json
        run: pnpm --filter @ax/web test:e2e:demo --reporter=list,json --output=test-results/demo

      - name: E2E 토큰 계산값 (다크 · 브랜드, AC6)
        id: e2e-tokens
        if: ${{ !cancelled() && steps.e2e-a11y.outcome != 'skipped' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/apps/web/playwright-report/tokens.json
        run: pnpm --filter @ax/web test:e2e:tokens --reporter=list,json --output=test-results/tokens

      # 실행 건수 가드: 0건 실행이나 spec 축소가 통과로 보이지 않게 한다.
      # 기대 건수는 spec 을 바꾸면 함께 고친다. 실측(playwright --list): a11y 40 · demo 8 (2026-10-18),
      # nontext 8 (2026-10-19, 포커스 링 ontology 2조합 x 2 + 상태 표식 실요소 4조합 x 1, D1 「주 표식만 판정」),
      # tokens 22 (2026-10-19, 라이트 선택자 (0,2,0) 상향과 「프로젝트 :root 가 브랜드 뒤」 갈래 5건 추가).
      # a11y 는 조합(default/light · default/dark · ontology/light · ontology/dark)마다 10건인지도 본다(M4 에서 브랜드 전환 데모 페이지를 더함).
      # nontext 는 상태 표식 4조합마다 1건, 포커스 링 ontology 라이트 · 다크마다 2건인지 본다.
      - name: E2E 실행 건수 가드
        id: e2e-count
        if: ${{ !cancelled() && steps.e2e-a11y.outcome != 'skipped' }}
        working-directory: apps/web/playwright-report
        run: |
          fail=0
          {
            echo '### E2E 실행 건수 (WI-0025)'
            echo ''
            echo '| suite | 기대 | 실행 | 통과 | 실패 | flaky | skipped |'
            echo '|---|---|---|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          for spec in a11y:40 nontext:8 tokens:22 demo:8; do
            name=${spec%%:*}; want=${spec##*:}; f="$name.json"
            if [ ! -s "$f" ]; then
              echo "::error::$name: $f 가 없어요 (측정 실패, 0건 실행)"
              echo "| $name | $want | 측정 실패 | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
              fail=1; continue
            fi
            read -r ok bad flaky skipped < <(jq -r '[.stats.expected // 0, .stats.unexpected // 0, .stats.flaky // 0, .stats.skipped // 0] | @tsv' "$f")
            for x in "$ok" "$bad" "$flaky" "$skipped"; do
              [[ "$x" =~ ^[0-9]+$ ]] || { echo "::error::$name: stats 값을 읽지 못했어요 ('$x')"; fail=1; continue 2; }
            done
            got=$((ok + bad + flaky))
            echo "| $name | $want | $got | $ok | $bad | $flaky | $skipped |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$got" -ne "$want" ] || [ "$skipped" -ne 0 ]; then
              echo "::error::$name: 실행 ${got}건 · skipped ${skipped}건 (기대 ${want}건 · skipped 0)"
              fail=1
            fi
          done
          if [ -s a11y.json ]; then
            for combo in default/light default/dark ontology/light ontology/dark; do
              n=$(jq --arg t "a11y ($combo)" '[.. | objects | select(.title? == $t) | .specs[]?] | length' a11y.json)
              if ! [[ "$n" =~ ^[0-9]+$ ]] || [ "$n" -ne 10 ]; then
                echo "::error::a11y ($combo): ${n}건 (기대 10건)"
                fail=1
              fi
            done
          fi
          if [ -s nontext.json ]; then
            for want in 'nontext status (default/light):1' 'nontext status (default/dark):1' 'nontext status (ontology/light):1' 'nontext status (ontology/dark):1' 'nontext (ontology/light):2' 'nontext (ontology/dark):2'; do
              t=${want%:*}; w=${want##*:}
              n=$(jq --arg t "$t" '[.. | objects | select(.title? == $t) | .specs[]?] | length' nontext.json)
              if ! [[ "$n" =~ ^[0-9]+$ ]] || [ "$n" -ne "$w" ]; then
                echo "::error::$t: ${n}건 (기대 ${w}건)"
                fail=1
              fi
            done
          fi
          exit $fail

      # outcome 은 continue-on-error 와 무관하게 step 자체의 결과라 게이트를 켠 뒤에도 실패 때 'failure' 다.
      # !cancelled() 가 암묵 success() 를 대신하므로 앞 step 이 실패한 job 에서도 이 step 은 평가된다.
      - name: Upload E2E results (실패 시)
        if: ${{ !cancelled() && (steps.e2e-a11y.outcome == 'failure' || steps.e2e-nontext.outcome == 'failure' || steps.e2e-tokens.outcome == 'failure' || steps.e2e-demo.outcome == 'failure' || steps.e2e-count.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/out
          retention-days: 1

  # ===========================================
  # CD: Preview 배포 (PR)
  # ===========================================
  deploy-preview:
    name: Deploy Preview
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/out

      - name: Check Cloudflare credentials
        id: check-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "⏭️ Cloudflare credentials가 설정되지 않아 배포를 건너뜁니다."
            echo ""
            echo "🔧 설정 방법:"
            echo "  1. Cloudflare Dashboard → API Tokens → Create Token"
            echo "  2. 'Edit Cloudflare Workers' 템플릿 사용"
            echo "  3. GitHub Repository → Settings → Secrets and variables → Actions"
            echo "  4. CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 추가"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages (Preview)
        if: steps.check-cf.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_REF: ${{ github.head_ref }}
        run: npx wrangler pages deploy apps/web/out --project-name=axis-design-system --branch="$HEAD_REF"

      - name: Comment PR with preview URL
        if: steps.check-cf.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const safeBranch = branch.replace(/[^a-z0-9-]/gi, '-').toLowerCase();
            const previewUrl = `https://${safeBranch}.axis-design-system.pages.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Deployment\n\nDeployed to: ${previewUrl}`
            });

  # ===========================================
  # CD: Production 배포 (main push 또는 main 수동 dispatch)
  # workflow_dispatch 허용: GitHub Actions 이벤트 장애 시 수동 재배포 경로 (2026-08-07)
  # ===========================================
  deploy-production:
    name: Deploy Production
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/out

      - name: Check Cloudflare credentials
        id: check-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "⏭️ Cloudflare credentials가 설정되지 않아 배포를 건너뜁니다."
            echo ""
            echo "🔧 설정 방법:"
            echo "  1. Cloudflare Dashboard → API Tokens → Create Token"
            echo "  2. 'Edit Cloudflare Workers' 템플릿 사용"
            echo "  3. GitHub Repository → Settings → Secrets and variables → Actions"
            echo "  4. CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 추가"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages (Production)
        if: steps.check-cf.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/web/out --project-name=axis-design-system --branch=main
