name: Publish Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.changeset/**'
      - '.github/workflows/publish.yml'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # npm Trusted Publishing(OIDC)으로 발행하는 job은 main 브랜치에서만 동작(workflow_dispatch 포함)
    # npmjs.com Trusted Publisher 설정의 workflow 파일명(publish.yml)과 저장소가 이 job과 정확히 일치해야 한다
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      # npm Trusted Publishing OIDC 토큰 발급 권한(없으면 npm CLI가 OIDC를 조용히 건너뜀)
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 버전은 package.json packageManager(pnpm@9.15.4)를 SSOT로 사용한다.
      # action-setup에 version을 중복 지정하면 ERR_PNPM_BAD_PM_VERSION으로 실패(2026-02-01부터 재현).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          # registry-url 은 넣지 않는다(넣으면 setup-node 가 NODE_AUTH_TOKEN 용 .npmrc 를 쓴다)

      # Node 22 번들 npm(10.9.x)은 Trusted Publishing 최소 버전(11.5.1) 미달이다.
      # pnpm 9.15.4 publish 는 PATH 의 npm 에 위임하므로 이 버전이 OIDC 사용 여부를 결정한다.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11.19.1
          echo "node=$(node --version) npm=$(npm --version) npm_path=$(command -v npm)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Token reference check
        run: pnpm check-token-refs

      - name: Pack smoke (외부 npm 소비 검증)
        run: pnpm pack-smoke

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: 'chore(release): 패키지 버전 업데이트'
          commit: 'chore(release): 패키지 버전 업데이트'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN 은 넘기지 않는다(있으면 action 이 ~/.npmrc 에 토큰을 써서 OIDC 실패가 가려진다)
